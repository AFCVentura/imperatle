# Opens pull requests for new or vulnerable dependency versions. CI runs on each
# one, so a breaking update shows up before it's merged. Minor and patch updates
# are grouped into one PR per ecosystem.
version: 2
updates:
  # API and test project (found through the solution)
  - package-ecosystem: nuget
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    groups:
      nuget:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node major the site runs on (24, see the web
      # Dockerfile and ci-cd.yml), so its majors are bumped by hand with Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]

  # Base images of the API Dockerfile
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday

  # Base image of the web Dockerfile (pinned Node LTS)
  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
