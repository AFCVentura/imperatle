<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 0 140 140">
  <defs>
    <linearGradient id="faceL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A366"/>
      <stop offset="1" stop-color="#B78F53"/>
    </linearGradient>
    <linearGradient id="faceR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A98447"/>
      <stop offset="1" stop-color="#937137"/>
    </linearGradient>
    <radialGradient id="ruby" cx="0.4" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#B8262F"/>
      <stop offset="1" stop-color="#6E0C15"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E5128"/>
      <stop offset="1" stop-color="#E2C690"/>
    </linearGradient>
    <!-- Furo do aro: o fundo aparece entre o bronze e o rubi -->
    <mask id="hole">
      <rect width="100" height="140" fill="#fff"/>
      <circle cx="50" cy="62" r="19" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#hole)">
  <!-- Bisel externo: 4 faixas entre o losango de fora e o de dentro -->
  <polygon points="50,2 6,62 17,62 50,15" fill="#D6B47A"/>
  <polygon points="50,2 94,62 83,62 50,15" fill="#C7A065"/>
  <polygon points="6,62 50,138 50,124 17,62" fill="#A9834A"/>
  <polygon points="94,62 50,138 50,124 83,62" fill="#8C6A38"/>

  <!-- Faces internas: esquerda clara, direita escura -->
  <polygon points="50,15 17,62 50,124" fill="url(#faceL)"/>
  <polygon points="50,15 83,62 50,124" fill="url(#faceR)"/>

  <!-- Bordinha do furo: escura em cima, clara embaixo, como chanfro rebaixado -->
  <circle cx="50" cy="62" r="19.7" fill="none" stroke="url(#rim)" stroke-width="1.4"/>
  </g>

  <!-- Rubi -->
  <circle cx="50" cy="62" r="13" fill="url(#ruby)"/>
  <ellipse cx="45.5" cy="57" rx="4" ry="2.6" fill="#fff" opacity="0.24" transform="rotate(-30 45.5 57)"/>
</svg>
